<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadGreen - Admin Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-green: #138A56;
            --accent-color: #0D643E;
            --text-dark: #111827;
            --text-muted: #4B5563;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background-color: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(229, 231, 235, 0.5);
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo img {
            height: 48px;
            object-fit: contain;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid #D1D5DB;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(19, 138, 86, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-green);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: var(--accent-color);
        }

        .error-msg {
            color: #DC2626;
            background-color: #FEF2F2;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #FECACA;
        }

        .back-home {
            display: inline-block;
            margin-top: 25px;
            color: var(--primary-green);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-home:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="logo">
            <img src="Logo name green.png" alt="Leadgreen Logo">
        </div>
        <h1>Admin Portal</h1>
        <p class="subtitle">Securely access the LeadGreen dashboard.</p>

        <div class="error-msg" id="errorMessage">Invalid login credentials.</div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" required placeholder="admin@leadgreen.org">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-login" id="btnSubmit">
                Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <a href="index.html" class="back-home">&larr; Back to Public Site</a>
    </div>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyA5lPT8Fyp265fvebWq4BelNE0dYxuWvCE",
            authDomain: "leadgreen-fellowship.firebaseapp.com",
            projectId: "leadgreen-fellowship",
            storageBucket: "leadgreen-fellowship.firebasestorage.app",
            messagingSenderId: "639331926711",
            appId: "1:639331926711:web:03d9d47c8b33cef84a0332"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = 'Authenticating... <i class="fa-solid fa-spinner fa-spin"></i>';
            btnSubmit.disabled = true;
            errorMessage.style.display = 'none';

            try {
                // Request auth token from Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);

                // If successful, navigate directly to Admin Dashboard
                window.location.href = '../Admin/AdminDashboard.html';

            } catch (error) {
                // Display error gracefully
                errorMessage.textContent = 'Invalid credentials. Please verify your email and password.';
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    errorMessage.textContent = 'Incorrect admin email or password.';
                }
                errorMessage.style.display = 'block';
                btnSubmit.innerHTML = originalText;
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>

</html>
