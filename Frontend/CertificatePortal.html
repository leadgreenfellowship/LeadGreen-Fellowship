<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadGreen - Get Your Certificate</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PDF Lib -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@0.0.4/dist/fontkit.umd.min.js"></script>

    <style>
        :root {
            --primary-green: #138A56;
            --light-green: #E8F5EE;
            --hover-green: #F0F9F4;
            --text-main: #111827;
            --text-muted: #4B5563;
            --text-light: #9CA3AF;
            --border-color: #E5E7EB;
            --bg-body: #F3F4F6;
            --accent: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }

        .container {
            background-color: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            position: relative;
        }

        .header {
            background-color: var(--primary-green);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(19, 138, 86, 0.1);
        }

        .form-group .hint {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 5px;
        }

        .btn-generate {
            width: 100%;
            background-color: var(--primary-green);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-generate:hover {
            background-color: #0f6c44;
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .btn-generate:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
            transform: none;
        }

        #errorMsg {
            background: #FEF2F2;
            color: #DC2626;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #F87171;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            line-height: 1.4;
        }

        /* Loader */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .content {
                padding: 20px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="main-container">
        <!-- Main Form Screen -->
        <div id="form-screen">
            <div class="header">
                <h1>LeadGreen Certificate Portal</h1>
                <p>Retrieve and download your official certificate</p>
                <div
                    style="background: rgba(255,255,255,0.1); display: inline-block; padding: 10px 20px; border-radius: 30px; font-size: 13px;">
                    <i class="fa-solid fa-cloud-arrow-down" style="margin-right:5px;"></i> Instant Download
                </div>
            </div>

            <div class="content">
                <div id="errorMsg"></div>

                <form id="certificateForm">
                    <div class="form-group" style="margin-bottom: 25px;">
                        <label for="emailInput">Email Address</label>
                        <input type="email" id="emailInput" placeholder="Enter the email used for payment" required>
                        <div class="hint">Your confirmed certificate is securely linked to this email address.</div>
                    </div>

                    <button type="submit" class="btn-generate" id="submitBtn">
                        <i class="fa-solid fa-cogs" id="btnIcon"></i>
                        <div class="loader" id="btnLoader"></div>
                        <span id="btnText">Generate My Certificate</span>
                    </button>

                    <div
                        style="margin-top: 25px; text-align: center; font-size: 14px; color: var(--text-light); padding-top: 15px; border-top: 1px solid var(--border-color);">
                        Haven't paid the certificate fee yet? <br>
                        <a href="CertificatePayment.html"
                            style="color: var(--primary-green); font-weight: 600; text-decoration: none; display: inline-block; margin-top: 8px;">
                            Pay Certificate Fee Here <i class="fa-solid fa-arrow-right" style="font-size: 12px;"></i>
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Hidden Photopea API Engine -->
    <iframe id="pp" src="https://www.photopea.com"
        style="width:0; height:0; border:none; position:absolute; visibility:hidden;"></iframe>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA5lPT8Fyp265fvebWq4BelNE0dYxuWvCE",
            authDomain: "leadgreen-fellowship.firebaseapp.com",
            projectId: "leadgreen-fellowship",
            storageBucket: "leadgreen-fellowship.firebasestorage.app",
            messagingSenderId: "639331926711",
            appId: "1:639331926711:web:03d9d47c8b33cef84a0332"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const emailInput = document.getElementById('emailInput');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');

        // PHOTOPEA API SETUP
        let isPhotopeaReady = false;
        let isPsdLoaded = false;
        const ppIframe = document.getElementById("pp").contentWindow;

        // Listen for messages from Photopea
        window.addEventListener("message", function (e) {
            // Check if Photopea initialized
            if (e.data === "done") {
                isPhotopeaReady = true;
                console.log("Photopea Engine Loaded in background.");
            }

            // Check if Photopea sent us the final PDF back!
            if (e.data instanceof ArrayBuffer) {
                console.log("Received PDF from Photopea!");
                const blob = new Blob([e.data], { type: "application/pdf" });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "My_LeadGreen_Certificate.pdf";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                // Reset UI
                submitBtn.innerHTML = 'Download My Certificate';
                submitBtn.disabled = false;
            }
        });

        submitBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim().toLowerCase();
            if (!email) {
                errorMsg.textContent = "Please enter your email address.";
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            submitBtn.innerHTML = 'Verifying Record...';
            submitBtn.disabled = true;

            try {
                // 1. Verify Payment in Firestore
                const paymentsRef = collection(db, "certificate_payments");
                const q = query(paymentsRef, where("email", "==", email), limit(1));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    errorMsg.innerHTML = `No payment record found for <strong>${email}</strong>.<br><br>If you haven't paid yet, <a href="#" style="color:red; text-decoration:underline;">Click Here to Pay</a>.`;
                    errorMsg.style.display = 'block';
                    submitBtn.innerHTML = 'Download My Certificate';
                    submitBtn.disabled = false;
                    return;
                }

                // Get Fellow Data
                const fellowData = querySnapshot.docs[0].data();
                const fellowName = fellowData.fullName || fellowData.full_name || "Esteemed Fellow";

                submitBtn.innerHTML = 'Generating via Photoshop Engine...';

                // 2. Fetch the PSD File and Font (To send to Photopea)
                // Note: We use absolute/relative fetching. Ensure these files are hosted!
                let psdBytes = null;
                try {
                    const psdRes = await fetch("certificate.psd");
                    if (!psdRes.ok) throw new Error("PSD not found");
                    psdBytes = await psdRes.arrayBuffer();
                } catch (e) {
                    alert("Developer Error: Please upload 'certificate.psd' to the folder.");
                    submitBtn.innerHTML = 'Download My Certificate';
                    submitBtn.disabled = false;
                    return;
                }

                // Ensure Photopea is warm
                if (!isPhotopeaReady) {
                    alert("Photopea Engine is still starting up. Please try again in 3 seconds.");
                    submitBtn.innerHTML = 'Download My Certificate';
                    submitBtn.disabled = false;
                    return;
                }

                // 3. Command Photopea to load the PSD
                ppIframe.postMessage(psdBytes, "*");

                // Optional: Command Photopea to load the Font if you use a custom one
                // try { const fontRes = await fetch("Awesome.ttf"); const fontBytes = await fontRes.arrayBuffer(); ppIframe.postMessage(fontBytes, "*"); } catch(e) {}

                // 4. Send the Secret Photoshop Script
                // We use setTimeout to give Photopea 1 second to parse the PSD ArrayBuffer we just sent
                setTimeout(() => {
                    const script = `
                        try {
                            app.activeDocument.layers.getByName("Fellow Name").textItem.contents = "${fellowName.replace(/"/g, '\\"')}";
                            app.activeDocument.saveToOE("pdf");
                        } catch(e) {
                            alert("PSD Error: Could not find a text layer named exactly 'Fellow Name'. Please rename your text layer in Photoshop!");
                        }
                    `;
                    ppIframe.postMessage(script, "*");
                }, 1500);

            } catch (err) {
                console.error(err);
                errorMsg.textContent = "An error occurred verifying your record. Please try again.";
                errorMsg.style.display = 'block';
                submitBtn.innerHTML = 'Download My Certificate';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
