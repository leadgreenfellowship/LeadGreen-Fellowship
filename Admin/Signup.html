<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadgreen - Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #0D643E;
            --primary-green: #0e8549;
            --text-dark: #333333;
            --text-light: #ffffff;
            --bg-light: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            min-height: 100vh;
        }

        .login-container {
            display: flex;
            width: 100%;
        }

        .login-right {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        .back-to-home {
            position: absolute;
            top: 40px;
            right: 40px;
            text-decoration: none;
            color: #888;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-to-home:hover {
            color: var(--primary-red);
        }

        .form-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .form-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .form-header img {
            height: 85px;
            margin-bottom: 20px;
            margin-top: -10px;
        }

        .form-header h2 {
            font-size: 32px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .form-header p {
            color: #666;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            border: 2px solid #EEEEEE;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background-color: #FAFAFA;
            color: #333;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-red);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(13, 100, 62, 0.1);
        }

        .input-group input::placeholder {
            color: #BBBBBB;
        }

        .btn-login {
            width: 100%;
            background-color: var(--primary-red);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(13, 100, 62, 0.2);
            letter-spacing: 0.5px;
            margin-top: 15px;
        }

        .btn-login:hover {
            background-color: #14532D;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 100, 62, 0.3);
        }

        .signup-prompt {
            text-align: center;
            margin-top: 40px;
            font-size: 15px;
            color: #666;
        }

        .signup-prompt a {
            color: var(--primary-red);
            font-weight: 700;
            text-decoration: none;
            margin-left: 5px;
        }

        .signup-prompt a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <!-- Right Side: Form (Centered) -->
        <div class="login-right">
            <a href="#" class="back-to-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

            <div class="form-wrapper">
                <div class="form-header">
                    <a href="#">
                        <img src="Logo name green.png" alt="Leadgreen Logo">
                    </a>
                    <h2>Create Account</h2>
                    <p>Join the LeadGreen Fellowship and start your journey.</p>
                </div>

                <form id="signupForm">
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <p id="errorMessage" style="color: red; font-size: 14px; display: none; margin-bottom: 10px;"></p>
                    <button type="submit" id="submitBtn" class="btn-login">Create Account & Continue</button>
                </form>

                <div class="signup-prompt">
                    Already have an account? <a href="Login.html">Log In</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { db, auth, createUserWithEmailAndPassword, doc, setDoc, serverTimestamp } from './firebase-config.js';

        const signupForm = document.getElementById('signupForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = "Creating Account...";
            errorMessage.style.display = 'none';

            try {
                // 1. Create User in Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Add profile data & role to Firestore 'users' collection
                await setDoc(doc(db, "users", user.uid), {
                    name: fullname,
                    email: email,
                    role: "applicant",
                    createdAt: serverTimestamp()
                });

                // 3. Redirect to Onboarding or Application Dashboard
                window.location.href = "ApplicationDashboard copy.html";

            } catch (error) {
                console.error("Error signing up:", error);
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account & Continue";
            }
        });
    </script>
    </div>
    </div>
    </div>


</body>

</html>
