<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadGreen - Certificate Payments</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #138A56;
            --light-green: #E8F5EE;
            --hover-green: #F0F9F4;
            --text-main: #111827;
            --text-muted: #4B5563;
            --text-light: #9CA3AF;
            --border-color: #F3F4F6;
            --card-border: #E5E7EB;
            --bg-body: #FAFAFA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
        }

        /* Sidebar Layout - exact match */
        .layout {
            display: flex;
            width: 100%;
        }

        .sidebar {
            width: 260px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            background-color: #FFFFFF;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar-logo {
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .sidebar-logo img {
            height: 55px;
            object-fit: contain;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-item i {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .nav-item:hover {
            background-color: var(--hover-green);
            color: var(--text-main);
        }

        .nav-item.active {
            background-color: var(--light-green);
            color: var(--primary-green);
            font-weight: 600;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;
        }

        .nav-item.logout {
            color: #EF4444;
        }

        .nav-item.logout:hover {
            background-color: #FEF2F2;
        }

        /* Main Content */
        .content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            max-width: 1400px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .header-title p {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .header-title .subtitle {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background-color: #FFFFFF;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            margin-bottom: 25px;
        }

        .stat-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 800px;
        }

        th,
        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            background-color: #F9FAFB;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
            color: var(--text-main);
        }

        tbody tr:hover {
            background-color: #F9FAFB;
        }

        .badge-paid {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            background-color: #DCFCE7;
            color: #15803D;
        }

        .search-box {
            position: relative;
            width: 300px;
            margin-bottom: 20px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .search-box input {
            width: 100%;
            padding: 10px 10px 10px 35px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../Logo name green.png" alt="Leadgreen Logo" onerror="this.style.display='none'">
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-users"></i>
                    <span>Applications</span></a>
                <a href="AdminAnalytics.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i>
                    <span>Analytics</span></a>
                <a href="AdminAlumniImport.html" class="nav-item"><i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Import Alumni</span></a>
                <!-- New Certificates Menu -->
                <a href="AdminCertificates.html" class="nav-item active"><i class="fa-solid fa-certificate"></i>
                    <span>Certificate Payments</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logout-btn" class="nav-item logout"><i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Logout</span></a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="page-header">
                <div class="header-title">
                    <h1>Certificate Dashboard</h1>
                    <p>Track certificate requests.</p>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="card" style="margin-bottom:0;">
                    <div class="stat-label">Total Payments</div>
                    <div class="stat-number" id="stat-total">0</div>
                </div>
                <div class="card" style="margin-bottom:0;">
                    <div class="stat-label">Total Revenue Generated</div>
                    <div class="stat-number" id="stat-revenue" style="color: var(--primary-green);">₦0</div>
                </div>
            </div>

            <!-- Payments List -->
            <div class="card">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search name or email...">
                </div>

                <div class="table-responsive">
                    <table id="paymentsTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Reference</th>
                                <th>Amount</th>
                                <th>Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 30px;">Loading payments...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA5lPT8Fyp265fvebWq4BelNE0dYxuWvCE",
            authDomain: "leadgreen-fellowship.firebaseapp.com",
            projectId: "leadgreen-fellowship",
            storageBucket: "leadgreen-fellowship.firebasestorage.app",
            messagingSenderId: "639331926711",
            appId: "1:639331926711:web:03d9d47c8b33cef84a0332"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security Guard
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "AdminLogin.html";
            }
        });

        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            signOut(auth).then(() => {
                window.location.href = "AdminLogin.html";
            });
        });

        let allPayments = [];

        async function fetchPayments() {
            try {
                const q = query(collection(db, "certificate_payments"), orderBy("paidAt", "desc"));
                const querySnapshot = await getDocs(q);

                let totalAmount = 0;
                allPayments = [];

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    allPayments.push(data);

                    if (data.amount && !isNaN(data.amount)) {
                        totalAmount += parseFloat(data.amount);
                    }
                });

                document.getElementById('stat-total').innerText = allPayments.length;
                document.getElementById('stat-revenue').innerText = "₦" + totalAmount.toLocaleString();

                renderTable(allPayments);

            } catch (e) {
                console.error("Error loading payments: ", e);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="text-align:center;color:red;">Failed to load data. View console.</td></tr>';
            }
        }

        function renderTable(paymentsToRender) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            if (paymentsToRender.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 30px;">No payments found.</td></tr>';
                return;
            }

            paymentsToRender.forEach(payment => {
                const tr = document.createElement('tr');

                // Format date
                let dateStr = 'Unknown Date';
                if (payment.paidAt && payment.paidAt.toDate) {
                    dateStr = payment.paidAt.toDate().toLocaleDateString('en-GB', {
                        day: 'numeric', month: 'short', year: 'numeric'
                    });
                }

                // Format amount
                const amt = payment.amount ? parseFloat(payment.amount).toLocaleString() : '0';

                tr.innerHTML = `
                    <td style="font-weight: 500;">${payment.fullName || 'N/A'}</td>
                    <td style="color: var(--text-muted);">${payment.email || 'N/A'}</td>
                    <td style="font-family: monospace; font-size: 12px; color: var(--text-muted);">${payment.paymentReference || 'N/A'}</td>
                    <td style="font-weight: 600;">${payment.currency || 'USD'} ${amt}</td>
                    <td>${dateStr}</td>
                    <td><span class="badge-paid">Paid / Active</span></td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Search feature
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allPayments.filter(p => {
                const name = (p.fullName || '').toLowerCase();
                const email = (p.email || '').toLowerCase();
                return name.includes(term) || email.includes(term);
            });
            renderTable(filtered);
        });

        fetchPayments();
    </script>
</body>

</html>
